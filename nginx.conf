server {
    listen 80;
    server_name localhost;

    # ETag for revalidation
    etag on;

    # Brotli: serve precompiled .br if present, else compress on the fly
    brotli_static on;
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml application/json;

    # Gzip: serve precompiled .gz if present, else compress on the fly
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    
    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;
    
    # Serve the docs under /docs path
    location /docs {
        alias /usr/share/nginx/html/docs;
        try_files $uri $uri.html $uri/ =404;

        # HTML - always revalidate via ETag
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Cache static assets (single Cache-Control, no expires dup)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|otf|mp4|webm)$ {
            add_header Cache-Control "public, immutable, max-age=31536000";
        }
    }
    
    # Redirect root to /docs
    location = / {
        return 301 /docs/;
    }

    # Redirect language paths without /docs prefix
    location ~ ^/(en|ru)(/.*)?$ {
        return 301 /docs$request_uri;
    }
    
    # Handle 404 errors
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
